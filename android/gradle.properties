org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Rule 3 auto-fix (01-02, blocking): this repo checks out on drive D: while the
# Flutter SDK's pub cache lives on drive C:. Kotlin's incremental-compilation
# cache (RelocatableFileToPathConverter) tries to compute a relative path
# between plugin sources (C:) and the module build dir (D:), which throws
# "this and base files have different roots" on Windows and fails
# :<plugin>:compileDebugKotlin for every plugin carrying native Kotlin code
# (device_info_plus, flutter_timezone, google_sign_in_android, share_plus).
# Disabling Kotlin incremental compilation avoids the cross-drive relative-path
# computation entirely; cost is slower incremental Kotlin rebuilds, not
# correctness.
kotlin.incremental=false
