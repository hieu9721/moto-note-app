# docs/_config.yml — minimal Jekyll config for GitHub Pages (06-09, REL-04).
# This is a two-page static site (privacy policy, vi + en, plus a landing
# page) — no blog, no collections, nothing beyond what GitHub Pages needs to
# render Markdown under a theme.
#
# baseurl is the repository path GitHub Pages serves this site under
